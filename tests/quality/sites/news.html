<h1>市政会议通过预算案</h1>
<p class="byline">记者 张三 · 2026-09-11</p>
<p>NEWS-MARKER 市议会在周二晚间的会议上以 6:1 通过了下一财年预算案，其中包括对公园维护的额外拨款。</p>
<p>反对票来自第一选区的议员，他认为拨款结构未覆盖道路维修的长期缺口。</p>
<h2>主要变化</h2>
<ul><li>公园维护预算增加 12%</li><li>新增两个社区警务岗位</li><li>水务费率保持不变</li></ul>
<blockquote><p>“这不是一份完美的预算，但它保住了基本服务。”——市长</p></blockquote>
<p>预算案将在下月生效，市民可在市政网站上查阅全文。</p>
