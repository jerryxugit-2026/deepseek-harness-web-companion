<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>DSH Panel Spike</title>
    <style>
      html, body { margin: 0; padding: 0; height: 100%; background: #111; }
      #host { position: absolute; inset: 0; }
      iframe { width: 100%; height: 100%; border: 0; display: block; background: #fff; }
      #fallback { color: #eee; font: 12px/1.5 -apple-system, sans-serif; padding: 8px; }
    </style>
  </head>
  <body>
    <div id="host"><iframe id="dsh" src="http://127.0.0.1:3080/" allow="clipboard-read; clipboard-write"></iframe></div>
    <div id="fallback" hidden>iframe unavailable</div>
    <script src="panel.js"></script>
  </body>
</html>
